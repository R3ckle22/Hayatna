<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>U&me</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .app {
      max-width: 500px;
      margin: auto;
      min-height: 100vh;
      background: white;
      padding: 24px 18px;
    }

    .logo {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 30px;
    }

    .card {
      background: #fafafa;
      border: 1px solid #eee;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 15px;
    }

    .card h2 {
      margin-top: 0;
      font-size: 18px;
    }

    .amount {
      font-size: 30px;
      font-weight: bold;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 15px;
      font-size: 16px;
      cursor: pointer;
    }

    .income {
      background: #e8f7ed;
      color: #16743a;
    }

    .expense {
      background: #fdeaea;
      color: #a52b2b;
    }

    .goal {
      background: #eeeafd;
      color: #5142a8;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="logo">U&me</div>
    <div class="subtitle">Our shared space</div>

    <div class="card">
      <h2>Total Balance</h2>
      <div class="amount">0 EGP</div>
    </div>

    <div class="card">
      <h2>This Month</h2>

      <p>Income</p>
      <strong>0 EGP</strong>

      <p>Expenses</p>
      <strong>0 EGP</strong>
    </div>

    <div class="card">
      <h2>Our Goal</h2>
      <p>Start your first saving goal</p>
      <strong>0 / 0 EGP</strong>
    </div>

    <div class="buttons">
      <button class="income">+ Income</button>
      <button class="expense">+ Expense</button>
      <button class="goal">+ Saving Goal</button>
    </div>

  </div>

</body>
</html>
