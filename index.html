<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>U&me</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .app {
      max-width: 430px;
      min-height: 100vh;
      margin: auto;
      background: #fff;
      padding: 28px 20px;
    }

    .logo {
      font-size: 38px;
      font-weight: 700;
      margin: 25px 0 5px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 30px;
    }

    .card {
      border: 1px solid #eee;
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,.04);
    }

    h2 {
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 15px;
      margin: 7px 0;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border: 0;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
      background: #222;
      color: white;
    }

    button.secondary {
      background: #eee;
      color: #222;
    }

    button.logout {
      background: #f3dddd;
      color: #8b2222;
    }

    .hidden {
      display: none;
    }

    .code {
      font-size: 30px;
      font-weight: bold;
      letter-spacing: 4px;
      text-align: center;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 12px;
      margin: 15px 0;
    }

    #message {
      margin-top: 15px;
      color: #666;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="logo">U&me</div>
  <div class="subtitle">Our shared space</div>

  <!-- AUTH -->
  <div id="authScreen">

    <div class="card">

      <h2>Welcome</h2>

      <input
        id="email"
        type="email"
        placeholder="Email"
      >

      <input
        id="password"
        type="password"
        placeholder="Password"
      >

      <button onclick="signIn()">
        Login
      </button>

      <button class="secondary" onclick="signUp()">
        Create account
      </button>

    </div>

  </div>


  <!-- HOUSEHOLD -->
  <div id="householdScreen" class="hidden">

    <div class="card">

      <h2>Let's create our space</h2>

      <input
        id="displayName"
        type="text"
        placeholder="Your name"
      >

      <button onclick="createHousehold()">
        Create U&me Space
      </button>

    </div>


    <div class="card">

      <h2>Join a space</h2>

      <input
        id="joinName"
        type="text"
        placeholder="Your name"
      >

      <input
        id="inviteCode"
        type="text"
        placeholder="Invite code"
      >

      <button onclick="joinHousehold()">
        Join U&me Space
      </button>

    </div>

    <button class="logout" onclick="logout()">
      Logout
    </button>

  </div>


  <!-- HOME -->
  <div id="homeScreen" class="hidden">

    <div class="card">

      <h2 id="welcomeText">
        Welcome
      </h2>

      <p>
        Your U&me space is ready.
      </p>

      <p>
        Household:
        <strong id="householdName"></strong>
      </p>

    </div>


    <div class="card">

      <h2>Invite your partner</h2>

      <p>
        Share this code with your partner:
      </p>

      <div class="code" id="myInviteCode">
        ------
      </div>

      <button onclick="copyInviteCode()">
        Copy Invite Code
      </button>

    </div>


    <button class="logout" onclick="logout()">
      Logout
    </button>

  </div>


  <div id="message"></div>

</div>


<script>

const SUPABASE_URL =
"https://foswxvdnekimhkjkefdq.supabase.co";

const SUPABASE_KEY =
"sb_publishable_LlaYjmDPvzEU97_kr2azhg_jvkgAljS";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


let currentUser = null;
let currentHousehold = null;


function showMessage(message) {
  document.getElementById("message").textContent = message;
}


function showScreen(screen) {

  document.getElementById("authScreen")
    .classList.add("hidden");

  document.getElementById("householdScreen")
    .classList.add("hidden");

  document.getElementById("homeScreen")
    .classList.add("hidden");

  document.getElementById(screen)
    .classList.remove("hidden");
}


async function signUp() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if (!email || !password) {
    showMessage("Enter email and password.");
    return;
  }

  showMessage("Creating account...");

  const { error } =
    await supabaseClient.auth.signUp({
      email,
      password
    });

  if (error) {
    showMessage(error.message);
    return;
  }

  showMessage(
    "Account created. Check your email if confirmation is required."
  );
}


async function signIn() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if (!email || !password) {
    showMessage("Enter email and password.");
    return;
  }

  showMessage("Logging in...");

  const { data, error } =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  if (error) {
    showMessage(error.message);
    return;
  }

  currentUser = data.user;

  await loadUserState();
}


async function loadUserState() {

  if (!currentUser) return;

  const { data, error } =
    await supabaseClient
      .from("household_members")
      .select(`
        household_id,
        display_name,
        households (
          id,
          name,
          invite_code
        )
      `)
      .eq("user_id", currentUser.id)
      .limit(1);

  if (error) {
    showMessage(error.message);
    return;
  }

  if (!data || data.length === 0) {

    showScreen("householdScreen");

    showMessage(
      "Create a new U&me space or join your partner's space."
    );

    return;
  }

  const membership = data[0];

  currentHousehold =
    membership.households;

  document.getElementById("welcomeText")
    .textContent =
    "Welcome, " + membership.display_name;

  document.getElementById("householdName")
    .textContent =
    currentHousehold.name;

  document.getElementById("myInviteCode")
    .textContent =
    currentHousehold.invite_code;

  showScreen("homeScreen");
}


async function createHousehold() {

  const name =
    document.getElementById("displayName")
      .value.trim();

  if (!name) {
    showMessage("Enter your name.");
    return;
  }

  showMessage("Creating your U&me space...");

  const inviteCode =
    Math.random()
      .toString(36)
      .substring(2, 8)
      .toUpperCase();

  const { data: household, error } =
    await supabaseClient
      .from("households")
      .insert({
        name: "U&me",
        invite_code: inviteCode,
        created_by: currentUser.id
      })
      .select()
      .single();

  if (error) {
    showMessage(error.message);
    return;
  }

  const { error: memberError } =
    await supabaseClient
      .from("household_members")
      .insert({
        household_id: household.id,
        user_id: currentUser.id,
        display_name: name,
        role: "owner"
      });

  if (memberError) {
    showMessage(memberError.message);
    return;
  }

  currentHousehold = household;

  document.getElementById("welcomeText")
    .textContent =
    "Welcome, " + name;

  document.getElementById("householdName")
    .textContent =
    household.name;

  document.getElementById("myInviteCode")
    .textContent =
    household.invite_code;

  showScreen("homeScreen");

  showMessage("Your U&me space is ready!");
}


async function joinHousehold() {

  const name =
    document.getElementById("joinName")
      .value.trim();

  const code =
    document.getElementById("inviteCode")
      .value.trim()
      .toUpperCase();

  if (!name || !code) {
    showMessage("Enter your name and invite code.");
    return;
  }

  showMessage("Joining U&me space...");

  const { data, error } =
    await supabaseClient.rpc(
      "join_household_by_invite_code",
      {
        p_invite_code: code,
        p_display_name: name
      }
    );

  if (error) {
    showMessage(error.message);
    return;
  }

  currentHousehold = {
    id: data.household_id,
    name: data.household_name,
    invite_code: code
  };

  document.getElementById("welcomeText")
    .textContent =
    "Welcome, " + name;

  document.getElementById("householdName")
    .textContent =
    data.household_name;

  document.getElementById("myInviteCode")
    .textContent =
    code;

  showScreen("homeScreen");

  showMessage("You joined the U&me space!");
}


async function copyInviteCode() {

  const code =
    document.getElementById("myInviteCode")
      .textContent;

  await navigator.clipboard.writeText(code);

  showMessage("Invite code copied!");
}


async function logout() {

  await supabaseClient.auth.signOut();

  currentUser = null;
  currentHousehold = null;

  showScreen("authScreen");

  showMessage("Logged out.");
}


supabaseClient.auth.onAuthStateChange(
  async (event, session) => {

    if (session && session.user) {

      currentUser = session.user;

      setTimeout(
        () => loadUserState(),
        0
      );

    } else {

      showScreen("authScreen");

    }
  }
);

</script>

</body>
</html>
