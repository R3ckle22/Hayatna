<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>U&me</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .app {
      max-width: 430px;
      min-height: 100vh;
      margin: auto;
      background: white;
      padding: 30px 20px;
    }

    .logo {
      font-size: 38px;
      font-weight: 700;
      margin-top: 50px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 35px;
    }

    .card {
      border: 1px solid #eee;
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 5px 20px rgba(0,0,0,.04);
    }

    h2 {
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 15px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border: 0;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
      background: #222;
      color: white;
    }

    button.secondary {
      background: #eee;
      color: #222;
    }

    #message {
      margin-top: 15px;
      font-size: 14px;
      color: #777;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="logo">U&me</div>
  <div class="subtitle">Our shared space</div>

  <div class="card">

    <h2>Welcome</h2>

    <input id="email" type="email" placeholder="Email">

    <input id="password" type="password" placeholder="Password">

    <button onclick="signIn()">Login</button>

    <button class="secondary" onclick="signUp()">
      Create account
    </button>

    <div id="message"></div>

  </div>

</div>

<script>

const SUPABASE_URL =
"https://foswxvdnekimhkjkefdq.supabase.co";

const SUPABASE_KEY =
"sb_publishable_LlaYjmDPvzEU97_kr2azhg_jvkgAljS";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

function showMessage(message) {
  document.getElementById("message").textContent = message;
}

async function signUp() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if (!email || !password) {
    showMessage("Please enter email and password.");
    return;
  }

  showMessage("Creating account...");

  const { error } =
    await supabaseClient.auth.signUp({
      email: email,
      password: password
    });

  if (error) {
    showMessage(error.message);
    return;
  }

  showMessage(
    "Account created. Check your email if confirmation is required."
  );
}

async function signIn() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if (!email || !password) {
    showMessage("Please enter email and password.");
    return;
  }

  showMessage("Logging in...");

  const { data, error } =
    await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

  if (error) {
    showMessage(error.message);
    return;
  }

  showMessage("Login successful!");

}

</script>

</body>
</html>
